name: Build and Push Docker Images

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "GitLab branch to build"
        required: false
        default: "feat/OP-165433_admin-and-hr-can-create-and-update-kost"
  schedule:
    # Run every 10 minutes starting at minute 5 (5, 15, 25, 35, 45, 55)
    - cron: "5-59/10 * * * *"
  repository_dispatch:
    types: [gitlab_push]

env:
  GITLAB_REPO_URL: ${{ secrets.GITLAB_REPO_URL }}
  GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
  DEFAULT_BRANCH: "feat/OP-165433_admin-and-hr-can-create-and-update-kost"
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

jobs:
  # ==========================================
  # JOB 1: TEST API
  # ==========================================
  test-api:
    name: Run API Unit Tests
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.get_sha.outputs.commit_sha }}
      should_push: ${{ steps.check_image.outputs.should_push }}
    steps:
      - name: Determine Branch
        run: |
          TARGET_BRANCH="${{ github.event.inputs.branch || env.DEFAULT_BRANCH }}"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> $GITHUB_ENV

      - name: Checkout Code from GitLab
        run: |
          CLEAN_REPO_URL=$(echo "${{ secrets.GITLAB_REPO_URL }}" | sed -E 's#^https?://##')
          git clone --branch ${{ env.TARGET_BRANCH }} --depth 1 "https://oauth2:${{ secrets.GITLAB_TOKEN }}@${CLEAN_REPO_URL}" .

      - name: Get Commit SHA
        id: get_sha
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
          echo "Latest commit on GitLab: $COMMIT_SHA"

      - name: Log in to Docker Hub (for checking manifest)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check if API image already built
        id: check_image
        run: |
          IMAGE_API="${{ env.DOCKERHUB_USERNAME }}/fmlx-kostfinder:backend-${{ env.COMMIT_SHA }}"
          echo "Checking image manifest: $IMAGE_API"
          if docker manifest inspect $IMAGE_API > /dev/null 2>&1; then
            echo "API image for commit ${{ env.COMMIT_SHA }} already exists on Docker Hub. Skipping tests and build."
            echo "should_push=false" >> $GITHUB_OUTPUT
          else
            echo "API image not found on Docker Hub. Proceeding with tests."
            echo "should_push=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up .NET 8
        if: steps.check_image.outputs.should_push == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run Unit Tests
        if: steps.check_image.outputs.should_push == 'true'
        run: |
          dotnet test KostFinder.Tests/KostFinder.Tests.csproj --configuration Release --nologo --verbosity normal

  # ==========================================
  # JOB 2: BUILD API
  # ==========================================
  build-api:
    name: Build API Image
    needs: test-api
    if: needs.test-api.outputs.should_push == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Determine Branch
        run: |
          TARGET_BRANCH="${{ github.event.inputs.branch || env.DEFAULT_BRANCH }}"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> $GITHUB_ENV

      - name: Checkout Code from GitLab
        run: |
          CLEAN_REPO_URL=$(echo "${{ secrets.GITLAB_REPO_URL }}" | sed -E 's#^https?://##')
          git clone --branch ${{ env.TARGET_BRANCH }} --depth 1 "https://oauth2:${{ secrets.GITLAB_TOKEN }}@${CLEAN_REPO_URL}" .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build KostFinder.API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./KostFinder.API/Dockerfile
          load: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/fmlx-kostfinder:backend-${{ needs.test-api.outputs.commit_sha }}
            ${{ env.DOCKERHUB_USERNAME }}/fmlx-kostfinder:backend

      - name: Save API Docker Image to Tarball
        run: |
          docker save \
            ${{ env.DOCKERHUB_USERNAME }}/fmlx-kostfinder:backend-${{ needs.test-api.outputs.commit_sha }} \
            ${{ env.DOCKERHUB_USERNAME }}/fmlx-kostfinder:backend \
            -o api-image.tar

      - name: Upload API Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-docker-image
          path: api-image.tar
          retention-days: 1

  # ==========================================
  # JOB 3: PUSH API
  # ==========================================
  push-api:
    name: Push API Image
    needs: [test-api, build-api]
    if: needs.test-api.outputs.should_push == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download API Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: api-docker-image

      - name: Load API Docker Image
        run: |
          docker load -i api-image.tar
          rm -f api-image.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push API Image to Docker Hub
        run: |
          docker push ${{ env.DOCKERHUB_USERNAME }}/fmlx-kostfinder:backend-${{ needs.test-api.outputs.commit_sha }}
          docker push ${{ env.DOCKERHUB_USERNAME }}/fmlx-kostfinder:backend

  # ==========================================
  # JOB 4: BUILD WEB
  # ==========================================
  build-web:
    name: Build Web Image
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.get_sha.outputs.commit_sha }}
      should_push: ${{ steps.check_image.outputs.should_push }}
    steps:
      - name: Determine Branch
        run: |
          TARGET_BRANCH="${{ github.event.inputs.branch || env.DEFAULT_BRANCH }}"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> $GITHUB_ENV

      - name: Checkout Code from GitLab
        run: |
          CLEAN_REPO_URL=$(echo "${{ secrets.GITLAB_REPO_URL }}" | sed -E 's#^https?://##')
          git clone --branch ${{ env.TARGET_BRANCH }} --depth 1 "https://oauth2:${{ secrets.GITLAB_TOKEN }}@${CLEAN_REPO_URL}" .

      - name: Get Commit SHA
        id: get_sha
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
          echo "Latest commit on GitLab: $COMMIT_SHA"

      - name: Log in to Docker Hub (for checking manifest)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check if Web image already built
        id: check_image
        run: |
          IMAGE_WEB="${{ env.DOCKERHUB_USERNAME }}/fmlx-kostfinder:frontend-${{ env.COMMIT_SHA }}"
          echo "Checking image manifest: $IMAGE_WEB"
          if docker manifest inspect $IMAGE_WEB > /dev/null 2>&1; then
            echo "Web image for commit ${{ env.COMMIT_SHA }} already exists on Docker Hub. Skipping build."
            echo "should_push=false" >> $GITHUB_OUTPUT
          else
            echo "Web image not found on Docker Hub. Proceeding with build."
            echo "should_push=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.check_image.outputs.should_push == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build KostFinder.Web
        if: steps.check_image.outputs.should_push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./KostFinder.Web
          file: ./KostFinder.Web/Dockerfile
          load: true
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/fmlx-kostfinder:frontend-${{ env.COMMIT_SHA }}
            ${{ env.DOCKERHUB_USERNAME }}/fmlx-kostfinder:frontend

      - name: Save Web Docker Image to Tarball
        if: steps.check_image.outputs.should_push == 'true'
        run: |
          docker save \
            ${{ env.DOCKERHUB_USERNAME }}/fmlx-kostfinder:frontend-${{ env.COMMIT_SHA }} \
            ${{ env.DOCKERHUB_USERNAME }}/fmlx-kostfinder:frontend \
            -o web-image.tar

      - name: Upload Web Image Artifact
        if: steps.check_image.outputs.should_push == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: web-docker-image
          path: web-image.tar
          retention-days: 1

  # ==========================================
  # JOB 5: PUSH WEB
  # ==========================================
  push-web:
    name: Push Web Image
    needs: build-web
    if: needs.build-web.outputs.should_push == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download Web Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-docker-image

      - name: Load Web Docker Image
        run: |
          docker load -i web-image.tar
          rm -f web-image.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Web Image to Docker Hub
        run: |
          docker push ${{ env.DOCKERHUB_USERNAME }}/fmlx-kostfinder:frontend-${{ needs.build-web.outputs.commit_sha }}
          docker push ${{ env.DOCKERHUB_USERNAME }}/fmlx-kostfinder:frontend
